name: Update Native Agent Versions

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Android agent version (leave empty to fetch latest)'
        required: false
        type: string
      ios_version:
        description: 'iOS agent version (leave empty to fetch latest)'
        required: false
        type: string
      create_pr:
        description: 'Create PR with new branch (always true for this workflow)'
        required: false
        type: boolean
        default: true
  push:
    branches:
      - '**'
    paths:
      - '.github/workflows/update_native_agent_version.yml'
  schedule:
    # Run weekly on Monday at 9:00 AM UTC to check for updates
    - cron: '0 9 * * 1'

jobs:
  update-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'

      - name: Fetch latest Android agent version
        id: android_version
        run: |
          if [ -n "${{ inputs.android_version }}" ]; then
            VERSION="${{ inputs.android_version }}"
            echo "Using provided Android version: $VERSION"
          else
            # Fetch latest version from Maven Central metadata
            VERSION=$(curl -s 'https://repo1.maven.org/maven2/com/newrelic/agent/android/android-agent/maven-metadata.xml' | \
              grep '<latest>' | \
              sed 's/.*<latest>\(.*\)<\/latest>.*/\1/')
            echo "Fetched latest Android version: $VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Fetch latest iOS agent version
        id: ios_version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.ios_version }}" ]; then
            VERSION="${{ inputs.ios_version }}"
            echo "Using provided iOS version: $VERSION"
          else
            # Highest X.Y.Z tag on the iOS agent SPM repo. Every production build pushes a tag there, but
            # GitHub Releases are created by hand and some versions (e.g. 7.7.8) never got one.
            VERSION=$(gh api --paginate 'repos/newrelic/newrelic-ios-agent-spm/tags?per_page=100' -q '.[].name' | \
              grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            echo "Fetched latest iOS version: $VERSION"
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Could not determine the iOS agent version (got '$VERSION')"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Only move the NewRelicAgent pod pin to versions that are on CocoaPods. The SPM tag can land before
          # the pod, and once CocoaPods trunk is read-only new versions won't be published as pods at all; pinning
          # a pod that doesn't exist breaks `pod install`. 1/a/2 is the CocoaPods CDN shard for NewRelicAgent.
          if curl -sfL --retry 3 --max-time 30 -o /dev/null "https://cdn.cocoapods.org/Specs/1/a/2/NewRelicAgent/$VERSION/NewRelicAgent.podspec.json"; then
            echo "pod_available=true" >> $GITHUB_OUTPUT
          else
            echo "::notice::NewRelicAgent $VERSION is not on CocoaPods; leaving the CocoaPods pin unchanged"
            echo "pod_available=false" >> $GITHUB_OUTPUT
          fi

      - name: Get current versions
        id: current_versions
        run: |
          CURRENT_ANDROID=$(jq -r '.sdkVersions.android.newrelic' package.json)
          CURRENT_IOS=$(jq -r '.sdkVersions.ios.newrelic' package.json | sed 's/~>//')
          # sdkVersions.ios.cocoapods is only present when the pod pin lags the SPM version
          CURRENT_IOS_POD=$(jq -r '.sdkVersions.ios.cocoapods // .sdkVersions.ios.newrelic' package.json | sed 's/~>//')
          CURRENT_PLUGIN=$(jq -r '.version' package.json)

          echo "current_android=$CURRENT_ANDROID" >> $GITHUB_OUTPUT
          echo "current_ios=$CURRENT_IOS" >> $GITHUB_OUTPUT
          echo "current_ios_pod=$CURRENT_IOS_POD" >> $GITHUB_OUTPUT
          echo "current_plugin=$CURRENT_PLUGIN" >> $GITHUB_OUTPUT

          echo "Current Android version: $CURRENT_ANDROID"
          echo "Current iOS version: $CURRENT_IOS"
          echo "Current iOS version (CocoaPods): $CURRENT_IOS_POD"
          echo "Current Plugin version: $CURRENT_PLUGIN"

      - name: Check if updates are needed
        id: check_updates
        run: |
          NEEDS_UPDATE=false
          ANDROID_UPDATED=false
          IOS_UPDATED=false

          if [ "${{ steps.current_versions.outputs.current_android }}" != "${{ steps.android_version.outputs.version }}" ]; then
            echo "Android version needs update"
            NEEDS_UPDATE=true
            ANDROID_UPDATED=true
          fi

          if [ "${{ steps.current_versions.outputs.current_ios }}" != "${{ steps.ios_version.outputs.version }}" ]; then
            echo "iOS version needs update"
            NEEDS_UPDATE=true
            IOS_UPDATED=true
          fi

          echo "needs_update=$NEEDS_UPDATE" >> $GITHUB_OUTPUT
          echo "android_updated=$ANDROID_UPDATED" >> $GITHUB_OUTPUT
          echo "ios_updated=$IOS_UPDATED" >> $GITHUB_OUTPUT

      - name: Calculate new plugin version (patch bump)
        id: new_plugin_version
        if: steps.check_updates.outputs.needs_update == 'true'
        run: |
          CURRENT_VERSION="${{ steps.current_versions.outputs.current_plugin }}"
          echo "Current version: $CURRENT_VERSION"

          # Increment patch version (e.g., 1.5.11 -> 1.5.12)
          major=$(echo "$CURRENT_VERSION" | cut -d. -f1)
          minor=$(echo "$CURRENT_VERSION" | cut -d. -f2)
          patch=$(echo "$CURRENT_VERSION" | cut -d. -f3)

          echo "Parsed - Major: $major, Minor: $minor, Patch: $patch"

          NEW_PATCH=$((patch + 1))
          NEW_VERSION="$major.$minor.$NEW_PATCH"

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New plugin version will be: $NEW_VERSION"

      - name: Update package.json
        if: steps.check_updates.outputs.needs_update == 'true'
        run: |
          NEW_VERSION="${{ steps.new_plugin_version.outputs.new_version }}"
          ANDROID_VERSION="${{ steps.android_version.outputs.version }}"
          IOS_VERSION="${{ steps.ios_version.outputs.version }}"

          # sdkVersions.ios.newrelic drives the SPM requirement (NEWRELIC_USE_SPM=1) and, unless
          # sdkVersions.ios.cocoapods is set, the NewRelicAgent pod requirement too. When this version
          # isn't on CocoaPods, keep the pod on its current requirement by saving it to .cocoapods.
          if [ "${{ steps.ios_version.outputs.pod_available }}" = "true" ]; then
            IOS_POD_FILTER='del(.sdkVersions.ios.cocoapods)'
          else
            IOS_POD_FILTER='.sdkVersions.ios.cocoapods //= .sdkVersions.ios.newrelic'
          fi

          # Update package.json using jq
          jq --arg version "$NEW_VERSION" \
             --arg android "$ANDROID_VERSION" \
             --arg ios "~>$IOS_VERSION" \
             ".version = \$version | .sdkVersions.android.newrelic = \$android | $IOS_POD_FILTER | .sdkVersions.ios.newrelic = \$ios" \
             package.json > package-tmp.json && mv package-tmp.json package.json

          echo "Updated package.json"

      - name: Update README.md
        if: steps.check_updates.outputs.needs_update == 'true'
        run: |
          ANDROID_VERSION="${{ steps.android_version.outputs.version }}"

          # Update Android agent version in README.md
          sed -i "s/com.newrelic.agent.android:agent-gradle-plugin:[0-9.]\+/com.newrelic.agent.android:agent-gradle-plugin:$ANDROID_VERSION/" README.md

          echo "Updated README.md"

      - name: Update CHANGELOG.md
        if: steps.check_updates.outputs.needs_update == 'true'
        run: |
          ANDROID_VERSION="${{ steps.android_version.outputs.version }}"
          IOS_VERSION="${{ steps.ios_version.outputs.version }}"
          NEW_VERSION="${{ steps.new_plugin_version.outputs.new_version }}"
          ANDROID_UPDATED="${{ steps.check_updates.outputs.android_updated }}"
          IOS_UPDATED="${{ steps.check_updates.outputs.ios_updated }}"
          POD_AVAILABLE="${{ steps.ios_version.outputs.pod_available }}"
          CURRENT_IOS_POD="${{ steps.current_versions.outputs.current_ios_pod }}"

          # Create changelog entry
          CHANGELOG_ENTRY="## $NEW_VERSION\n\n## Improvements\n\n"

          if [ "$ANDROID_UPDATED" = "true" ]; then
            CHANGELOG_ENTRY="${CHANGELOG_ENTRY}- Updated the Native Android agent to version ${ANDROID_VERSION}.\n"
          fi

          if [ "$IOS_UPDATED" = "true" ] && [ "$POD_AVAILABLE" = "true" ]; then
            CHANGELOG_ENTRY="${CHANGELOG_ENTRY}- Updated the Native iOS agent to version ${IOS_VERSION}.\n"
          elif [ "$IOS_UPDATED" = "true" ]; then
            CHANGELOG_ENTRY="${CHANGELOG_ENTRY}- Updated the Native iOS agent to version ${IOS_VERSION} for Swift Package Manager (\`NEWRELIC_USE_SPM=1\`). CocoaPods installs stay on ${CURRENT_IOS_POD} because ${IOS_VERSION} is not available on CocoaPods.\n"
          fi

          CHANGELOG_ENTRY="${CHANGELOG_ENTRY}\n"

          # Prepend to CHANGELOG.md after the header
          sed -i "2i\\$CHANGELOG_ENTRY" CHANGELOG.md
          echo "Updated CHANGELOG.md"

      - name: Run tests
        if: steps.check_updates.outputs.needs_update == 'true'
        run: |
          npm install
          npm test || echo "Tests completed"

      - name: Setup GitHub Credentials
        if: steps.check_updates.outputs.needs_update == 'true'
        run: |
          git config user.name $GITHUB_ACTOR
          git config user.email gh-actions-${GITHUB_ACTOR}@github.com

      - name: Create Pull Request
        if: steps.check_updates.outputs.needs_update == 'true'
        run: |
          ANDROID_VERSION="${{ steps.android_version.outputs.version }}"
          IOS_VERSION="${{ steps.ios_version.outputs.version }}"
          NEW_VERSION="${{ steps.new_plugin_version.outputs.new_version }}"
          CURRENT_VERSION="${{ steps.current_versions.outputs.current_plugin }}"
          CURRENT_ANDROID="${{ steps.current_versions.outputs.current_android }}"
          CURRENT_IOS="${{ steps.current_versions.outputs.current_ios }}"
          ANDROID_UPDATED="${{ steps.check_updates.outputs.android_updated }}"
          IOS_UPDATED="${{ steps.check_updates.outputs.ios_updated }}"
          POD_AVAILABLE="${{ steps.ios_version.outputs.pod_available }}"
          CURRENT_IOS_POD="${{ steps.current_versions.outputs.current_ios_pod }}"

          # Create branch name
          BRANCH_NAME="update-native-agents-${NEW_VERSION}"

          # Create and checkout new branch
          git checkout -b "$BRANCH_NAME"

          # Add changes
          git add package.json README.md CHANGELOG.md

          # Create commit message
          COMMIT_MSG="chore: Update native agents to v${NEW_VERSION}"
          if [ "$ANDROID_UPDATED" = "true" ] && [ "$IOS_UPDATED" = "true" ]; then
            COMMIT_MSG="${COMMIT_MSG}\n\n- Updated Android agent from ${CURRENT_ANDROID} to ${ANDROID_VERSION}\n- Updated iOS agent from ${CURRENT_IOS} to ${IOS_VERSION}\n- Bumped plugin version from ${CURRENT_VERSION} to ${NEW_VERSION}\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n\nCo-Authored-By: Claude <noreply@anthropic.com>"
          elif [ "$ANDROID_UPDATED" = "true" ]; then
            COMMIT_MSG="${COMMIT_MSG}\n\n- Updated Android agent from ${CURRENT_ANDROID} to ${ANDROID_VERSION}\n- Bumped plugin version from ${CURRENT_VERSION} to ${NEW_VERSION}\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n\nCo-Authored-By: Claude <noreply@anthropic.com>"
          else
            COMMIT_MSG="${COMMIT_MSG}\n\n- Updated iOS agent from ${CURRENT_IOS} to ${IOS_VERSION}\n- Bumped plugin version from ${CURRENT_VERSION} to ${NEW_VERSION}\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n\nCo-Authored-By: Claude <noreply@anthropic.com>"
          fi

          # Commit changes
          git commit -m "$(echo -e "$COMMIT_MSG")"

          # Push branch
          git push origin HEAD

          # Create PR body
          PR_BODY="## Updates\n\nThis PR updates the native agent versions:\n\n"

          if [ "$ANDROID_UPDATED" = "true" ]; then
            PR_BODY="${PR_BODY}- **Android Agent**: ${CURRENT_ANDROID} → ${ANDROID_VERSION}\n"
          fi

          if [ "$IOS_UPDATED" = "true" ] && [ "$POD_AVAILABLE" = "true" ]; then
            PR_BODY="${PR_BODY}- **iOS Agent**: ${CURRENT_IOS} → ${IOS_VERSION}\n"
          elif [ "$IOS_UPDATED" = "true" ]; then
            PR_BODY="${PR_BODY}- **iOS Agent**: ${CURRENT_IOS} → ${IOS_VERSION} (Swift Package Manager only; \`NewRelicAgent\` ${IOS_VERSION} is not on CocoaPods, so \`sdkVersions.ios.cocoapods\` keeps the pod at \`~>${CURRENT_IOS_POD}\`)\n"
          fi

          PR_BODY="${PR_BODY}- **Plugin Version**: ${CURRENT_VERSION} → ${NEW_VERSION}\n\n"

          # Becomes the docs-website release notes (see CONTRIBUTING.md, "Release notes"): one list
          # line per updated agent, each its own bullet. Native agent updates are enhancements. The
          # sentences match the CHANGELOG.md entries written above word for word, so the release-time
          # reconciliation lists each update only once.
          RELEASE_NOTE=""
          if [ "$ANDROID_UPDATED" = "true" ]; then
            RELEASE_NOTE="- Updated the Native Android agent to version ${ANDROID_VERSION}."
          fi
          if [ "$IOS_UPDATED" = "true" ] && [ "$POD_AVAILABLE" = "true" ]; then
            RELEASE_NOTE="${RELEASE_NOTE:+$RELEASE_NOTE\n}- Updated the Native iOS agent to version ${IOS_VERSION}."
          elif [ "$IOS_UPDATED" = "true" ]; then
            RELEASE_NOTE="${RELEASE_NOTE:+$RELEASE_NOTE\n}- Updated the Native iOS agent to version ${IOS_VERSION} for Swift Package Manager (\`NEWRELIC_USE_SPM=1\`). CocoaPods installs stay on ${CURRENT_IOS_POD} because ${IOS_VERSION} is not available on CocoaPods."
          fi
          PR_BODY="${PR_BODY}## Release note\n\n${RELEASE_NOTE}\n\n"
          PR_BODY="${PR_BODY}## Files Updated\n\n- \`package.json\`\n- \`README.md\`\n- \`CHANGELOG.md\`\n\n"
          PR_BODY="${PR_BODY}## Testing\n\n- [ ] Tests pass\n- [ ] Android app builds successfully\n- [ ] iOS app builds successfully\n- [ ] Manual testing completed\n\n---\n\n"
          PR_BODY="${PR_BODY}This PR was automatically created by the Update Native Agent Versions workflow.\n\n"
          PR_BODY="${PR_BODY}🤖 Generated with [Claude Code](https://claude.com/claude-code)"

          # Create PR using gh CLI
          gh pr create \
            -B "main" \
            -H "$BRANCH_NAME" \
            --title "chore: Update native agents to v${NEW_VERSION}" \
            --body "$(echo -e "$PR_BODY")" \
            --label "enhancement,automated,release-note:enhancement"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: steps.check_updates.outputs.needs_update == 'true'
        run: |
          echo "## Version Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Old Version | New Version |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Android Agent | ${{ steps.current_versions.outputs.current_android }} | ${{ steps.android_version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS Agent | ${{ steps.current_versions.outputs.current_ios }} | ${{ steps.ios_version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Plugin Version | ${{ steps.current_versions.outputs.current_plugin }} | ${{ steps.new_plugin_version.outputs.new_version }} |" >> $GITHUB_STEP_SUMMARY

      - name: No updates needed
        if: steps.check_updates.outputs.needs_update == 'false'
        run: |
          echo "## No Updates Needed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All native agents are already up to date!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Android Agent: ${{ steps.android_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- iOS Agent: ${{ steps.ios_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY