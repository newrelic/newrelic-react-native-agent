name: Release notes - ready

# Once you've checked a release's docs-website note, run this with its version. It marks the draft
# docs PR that release-notes-generate.yml opened ready for review, as the bot that opened it, and
# comments with your name. See the README of newrelic/newrelic-android-agent's
# .github/actions/release-notes/.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release whose docs-website note you've checked, e.g. 1.9.3"
        required: true

permissions:
  contents: read

jobs:
  ready:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: newrelic/newrelic-android-agent/.github/actions/release-notes/ready@develop
        with:
          version: ${{ inputs.version }}
          bot-pat: ${{ secrets.BOT_PAT }}
          docs-repo: ${{ vars.DOCS_REPO || 'newrelic/docs-website' }}
