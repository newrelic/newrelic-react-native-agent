name: Release notes - dry run (delete before merging)

on:
  pull_request:

permissions:
  contents: write # generate-notes
  pull-requests: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Generate v1.9.2 (dry run)
        uses: newrelic/newrelic-android-agent/.github/actions/release-notes/generate@NR-620061-shared-release-notes
        with:
          version: 1.9.2
          dry-run: true
      - name: Append #330 (dry run, already released)
        uses: newrelic/newrelic-android-agent/.github/actions/release-notes/append@NR-620061-shared-release-notes
        with:
          pr-number: 330
          dry-run: true
